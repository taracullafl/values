<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFL Values Interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: transparent;
    color: #fff;
  }

  .activity-wrapper {
    width: 100%;
    padding: 24px 20px 28px;
    background: linear-gradient(160deg, #04285C 0%, #021a3a 100%);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .progress-label {
    font-size: 13px;
    opacity: 0.75;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: #fff;
  }

  .progress-bar {
    width: 100%;
    max-width: 280px;
    height: 5px;
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    overflow: hidden;
    margin: 0 auto;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #38A8FC, #5CD8FC);
    border-radius: 6px;
    transition: width 0.4s ease;
  }

  /* Instruction strip */
  .instruction-strip {
    text-align: center;
    font-size: 13px;
    opacity: 0.7;
    margin-bottom: 12px;
    letter-spacing: 0.2px;
    color: #fff;
  }

  /* Main 5-column grid: [scenario] + [4 value columns] */
  .value-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
  }

  /* ── Scenario card (first grid slot) ── */
  #scenario-area {
    display: flex;
    flex-direction: column;
  }

  .scenario-card {
    position: relative;
    background: #f0f7ff;
    color: #04285C;
    border-radius: 14px;
    width: 100%;
    flex: 1;
    cursor: grab;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.22);
    border: 2px solid rgba(56,168,252,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    animation: cardIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  /* Scenario card header band */
  .scenario-header {
    background: #04285C;
    padding: 10px 12px 9px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .scenario-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #fff;
  }

  /* Dashed icon next to label */
  .scenario-header-icon {
    width: 14px;
    height: 14px;
    opacity: 0.6;
    flex-shrink: 0;
  }

  /* Body: fills same visual space as the col-logo + gap area in value columns */
  .scenario-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 14px 20px;
  }

  .scenario-text {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.55;
    color: #04285C;
    text-align: center;
  }

  .drag-hint {
    font-family: Arial, sans-serif;
    font-size: 9px;
    color: rgba(4,40,92,0.4);
    padding: 0 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
    pointer-events: none;
  }

  .scenario-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.22);
    border-color: rgba(56,168,252,0.6);
  }

  .scenario-card:active, .scenario-card.dragging {
    cursor: grabbing;
    transform: scale(0.97) rotate(1.5deg);
    box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    opacity: 0.9;
  }

  .scenario-card:focus-visible {
    outline: 3px solid #38A8FC;
    outline-offset: 3px;
  }

  /* ── Value columns ── */
  .value-column {
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    border: 1.5px solid rgba(0,0,0,0.06);
    box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    transition: border-color 0.25s, transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
  }

  .value-column.dragover {
    border-color: #38A8FC;
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(56,168,252,0.28);
  }

  .value-column.pulse {
    animation: pulse 0.55s ease;
  }

  /* Accent bar */
  .col-accent {
    height: 6px;
    flex-shrink: 0;
  }

  .value-column[data-value="win"] .col-accent    { background: #4bb4e7; }
  .value-column[data-value="team"] .col-accent   { background: #F2A900; }
  .value-column[data-value="passion"] .col-accent { background: #e74442; }
  .value-column[data-value="fair"] .col-accent   { background: #66c0c9; }

  /* SVG logo */
  .col-logo {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: #fff;
  }

  .col-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Select button */
  .col-select-btn {
    border: none;
    border-top: 1.5px solid rgba(0,0,0,0.08);
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 9px 6px;
    cursor: pointer;
    transition: filter 0.15s;
    flex-shrink: 0;
    color: #fff;
  }

  .value-column[data-value="win"] .col-select-btn     { background: #4bb4e7; }
  .value-column[data-value="team"] .col-select-btn    { background: #F2A900; color: #333; }
  .value-column[data-value="passion"] .col-select-btn { background: #e74442; }
  .value-column[data-value="fair"] .col-select-btn    { background: #66c0c9; }

  .col-select-btn:hover { filter: brightness(1.1); }
  .col-select-btn:focus-visible {
    outline: 3px solid #04285C;
    outline-offset: -3px;
  }

  /* Dropzone */
  .dropzone {
    flex: 1;
    min-height: 50px;
    border-top: 1.5px dashed rgba(0,0,0,0.1);
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: rgba(0,0,0,0.025);
  }

  .placed-item {
    font-size: 10.5px;
    line-height: 1.35;
    color: #04285C;
    background: rgba(4,40,92,0.07);
    border-radius: 7px;
    padding: 6px 7px;
    animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* ── Feedback card ── */
  .feedback-card {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    animation: cardIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
    overflow: hidden;
  }

  .feedback-card .card-top-bar {
    width: 100%;
    height: 6px;
    flex-shrink: 0;
  }
  .feedback-card.correct .card-top-bar  { background: #5CB8B2; }
  .feedback-card.incorrect .card-top-bar { background: #D64545; }

  .feedback-inner {
    padding: 10px 14px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .feedback-heading {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    font-size: 15px;
  }
  .feedback-heading.correct  { color: #2a8a83; }
  .feedback-heading.incorrect { color: #D64545; }

  .feedback-text {
    font-size: 11.5px;
    line-height: 1.45;
    color: #333;
  }

  .feedback-btn {
    padding: 9px 12px;
    background: #04285C;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    transition: background 0.2s;
    width: 100%;
  }
  .feedback-btn:hover { background: #1F6FB2; }
  .feedback-btn:focus-visible {
    outline: 3px solid #38A8FC;
    outline-offset: 3px;
  }

  /* ── Complete card ── */
  .complete-card {
    background: #fff;
    color: #04285C;
    padding: 20px 14px;
    border-radius: 14px;
    width: 100%;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    animation: cardIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .complete-card p {
    font-family: Arial, sans-serif;
    text-transform: none;
    font-size: 10.5px;
    color: #555;
    margin-top: 8px;
    line-height: 1.4;
  }

  /* ── Animations ── */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(92,184,178,0.5); }
    70%  { box-shadow: 0 0 0 10px rgba(92,184,178,0); }
    100% { box-shadow: 0 0 0 0 rgba(92,184,178,0); }
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .value-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  }
  @media (max-width: 580px) {
    .value-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .activity-wrapper { padding: 18px 12px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>

shuffleArray(data);

let currentIndex = 0;
let answeredCorrectly = false;

const scenarioArea   = document.getElementById('scenario-area');
const progressLabel  = document.getElementById('progress-label');
const progressFill   = document.getElementById('progress-fill');
const progressBar    = document.getElementById('progress-bar');
const instructionStrip = document.getElementById('instruction-strip');
const columns        = document.querySelectorAll('.value-column');
const selectBtns     = document.querySelectorAll('.col-select-btn');

function updateProgress() {
  if (currentIndex >= data.length) {
    progressLabel.textContent = 'All complete!';
    progressFill.style.width = '100%';
    progressBar.setAttribute('aria-valuenow', 100);
    return;
  }
  progressLabel.textContent = `Scenario ${currentIndex + 1} of ${data.length}`;
  const pct = (currentIndex / data.length) * 100;
  progressFill.style.width = pct + '%';
  progressBar.setAttribute('aria-valuenow', Math.round(pct));
}

function loadCard() {
  answeredCorrectly = false;
  scenarioArea.innerHTML = '';
  instructionStrip.style.display = '';

  if (currentIndex >= data.length) {
    updateProgress();
    instructionStrip.style.display = 'none';
    const done = document.createElement('div');
    done.className = 'complete-card';
    done.setAttribute('role', 'status');
    done.innerHTML = '<div>&#10003; All scenarios complete</div><p>Reflect on how you live the values in your own work.</p>';
    scenarioArea.appendChild(done);
    selectBtns.forEach(b => b.disabled = true);
    return;
  }

  updateProgress();

  const item = data[currentIndex];
  const card = document.createElement('div');
  card.className = 'scenario-card';
  card.draggable = true;
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', `Scenario: ${item.text}`);

  card.innerHTML = `
    <div class="scenario-header">
      <svg class="scenario-header-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="21" x2="9" y2="9"/>
      </svg>
      <span class="scenario-label">Your Scenario</span>
    </div>
    <div class="scenario-body">
      <div class="scenario-text">${item.text}</div>
    </div>
    <div class="drag-hint" aria-hidden="true">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 9l-3 3 3 3M19 9l3 3-3 3M2 12h20"/>
      </svg>
      drag or tap a value's Select button
    </div>
  `;

  card.addEventListener('dragstart', e => {
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  scenarioArea.appendChild(card);
  card.focus();
}

function checkAnswer(selectedValue) {
  if (currentIndex >= data.length || answeredCorrectly) return;
  const item = data[currentIndex];

  if (selectedValue === item.value) {
    answeredCorrectly = true;
    const dropzone = document.getElementById('dropzone-' + item.value);
    const placed = document.createElement('div');
    placed.className = 'placed-item';
    placed.textContent = item.text;
    dropzone.appendChild(placed);

    const col = document.querySelector(`.value-column[data-value="${item.value}"]`);
    col.classList.add('pulse');
    setTimeout(() => col.classList.remove('pulse'), 600);

    showFeedback(item.feedback, true);
  } else {
    showFeedback('Not quite — think about what the behaviour demonstrates and try a different value.', false);
  }
}

function showFeedback(message, isCorrect) {
  scenarioArea.innerHTML = '';
  instructionStrip.style.display = 'none';

  const card = document.createElement('div');
  card.className = `feedback-card ${isCorrect ? 'correct' : 'incorrect'}`;
  card.setAttribute('role', 'status');

  card.innerHTML = `
    <div class="card-top-bar"></div>
    <div class="feedback-inner">
      <div class="feedback-heading ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '&#10003; Correct!' : 'Not quite'}</div>
      <div class="feedback-text">${message}</div>
      <button class="feedback-btn" type="button">${isCorrect ? 'Next Scenario &rarr;' : 'Try Again'}</button>
    </div>
  `;

  card.querySelector('.feedback-btn').onclick = isCorrect ? nextCard : retryCard;
  scenarioArea.appendChild(card);
  card.querySelector('.feedback-btn').focus();
}

function retryCard() { loadCard(); }
function nextCard()  { currentIndex++; loadCard(); }

// Drag-and-drop
columns.forEach(col => {
  col.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    col.classList.add('dragover');
  });
  col.addEventListener('dragleave', e => {
    if (!col.contains(e.relatedTarget)) col.classList.remove('dragover');
  });
  col.addEventListener('drop', e => {
    e.preventDefault();
    col.classList.remove('dragover');
    checkAnswer(col.dataset.value);
  });
});

// Button tap
selectBtns.forEach(btn => {
  btn.addEventListener('click', () => checkAnswer(btn.dataset.value));
});

loadCard();
</script>

</body>
</html>
